<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1c1b1a">
<title>SSH PHOTO</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SSH PHOTO">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
  @font-face{
    font-family:'Pretendard';
    src:url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/woff2/PretendardVariable.woff2') format('woff2-variations');
    font-weight:45 920;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:#1c1b1a;color:#f2efea;
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    overscroll-behavior:none; user-select:none;}
  #app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto;position:relative;}

  header{padding:14px 16px 10px; position:relative; border-bottom:1px solid #2c2a28;}
  header h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.2px;}
  header .sprockets{display:flex;gap:4px;position:absolute;right:16px;top:16px;}
  header .sprockets span{width:6px;height:6px;border-radius:1px;background:#e8a33d;opacity:.55;}

  #canvasWrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;
    background:repeating-conic-gradient(#232120 0% 25%, #201e1d 0% 50%) 50%/16px 16px; overflow:hidden;}
  #canvasWrap.empty::after{content:'사진을 불러오거나 촬영해 주세요';color:#8a8580;font-size:13px;}
  canvas{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);touch-action:none;
    box-shadow:0 8px 30px rgba(0,0,0,.5);}
  #stickerCanvas{cursor:grab;}
  #stickerCanvas.dragging{cursor:grabbing;}

  #loadRow{display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid #2c2a28;}
  #loadRow button{flex:1;padding:10px 8px;border:1px solid #3a3733;border-radius:10px;
    background:#242220;color:#f2efea;font-size:13px;font-weight:600;}
  #loadRow input[type=file]{display:none;}

  nav#tabs{display:flex;border-bottom:1px solid #2c2a28;background:#1c1b1a;}
  nav#tabs button{flex:1;padding:11px 4px;background:none;border:none;color:#8a8580;
    font-size:12.5px;font-weight:600;border-bottom:2px solid transparent;}
  nav#tabs button.active{color:#e8a33d;border-bottom-color:#e8a33d;}

  #panels{padding:14px 16px 18px;min-height:150px;}
  .panel{display:none;}
  .panel.active{display:block;}

  .slider-row{margin-bottom:14px;}
  .slider-row label{display:flex;justify-content:space-between;font-size:13px;color:#c9c4bc;margin-bottom:6px;}
  .slider-row label span{color:#e8a33d;font-variant-numeric:tabular-nums;}
  input[type=range]{width:100%;accent-color:#e8a33d;}

  .filter-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .filter-swatch{border:1px solid #3a3733;border-radius:10px;overflow:hidden;background:#242220;
    text-align:center;padding-bottom:6px;}
  .filter-swatch img{width:100%;height:64px;object-fit:cover;display:block;}
  .filter-swatch span{font-size:11.5px;color:#c9c4bc;}
  .filter-swatch.active{border-color:#e8a33d;}

  .sticker-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .sticker-row button{font-size:22px;background:#242220;border:1px solid #3a3733;border-radius:10px;
    width:44px;height:44px;}
  .tool-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;
    background:#242220;border:1px solid #3a3733;color:#f2efea;font-size:13px;font-weight:600;margin-right:8px;margin-bottom:8px;}
  .tool-btn.warn{border-color:#a3462f;color:#e88a73;}

  #saveBtn{width:100%;padding:14px;border:none;border-radius:12px;background:#e8a33d;color:#1c1b1a;
    font-size:15px;font-weight:800;letter-spacing:.2px;}
  #saveHint{text-align:center;font-size:12px;color:#8a8580;margin-top:10px;}

  footer{text-align:center;padding:8px 0 10px;font-size:11px;color:#5f5b56;letter-spacing:.3px;}

  #toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#242220;
    border:1px solid #3a3733;color:#f2efea;padding:10px 16px;border-radius:10px;font-size:13px;
    opacity:0;pointer-events:none;transition:.25s;z-index:50;}
  #toast.show{opacity:1;transform:translate(-50%,0);}

  #textModal,#loadingOverlay{position:fixed;inset:0;background:rgba(10,9,8,.72);display:none;
    align-items:center;justify-content:center;z-index:60;}
  #textModal.show,#loadingOverlay.show{display:flex;}
  #textModal .box{background:#242220;border:1px solid #3a3733;border-radius:14px;padding:18px;width:86%;max-width:340px;}
  #textModal textarea{width:100%;min-height:70px;background:#1c1b1a;border:1px solid #3a3733;border-radius:8px;
    color:#f2efea;padding:10px;font-size:14px;font-family:inherit;}
  #textModal .row{display:flex;gap:8px;margin-top:10px;}
  #textModal .row button{flex:1;padding:10px;border-radius:8px;border:1px solid #3a3733;background:#1c1b1a;color:#f2efea;font-weight:700;}
  #textModal .color{display:flex;gap:6px;margin-top:10px;}
  #textModal .color span{width:26px;height:26px;border-radius:50%;border:2px solid transparent;}
  #textModal .color span.sel{border-color:#e8a33d;}
  .swatch-row{display:flex;gap:8px;margin-top:4px;}
  .swatch-row span{width:26px;height:26px;border-radius:50%;display:inline-block;border:2px solid transparent;
    position:relative;}
  .swatch-row span.sel{border-color:#e8a33d;}
  .swatch-row span.none{background:#3a3733;}
  .swatch-row span.none::after{content:'✕';position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;font-size:11px;color:#8a8580;}
  #loadingOverlay p{color:#c9c4bc;font-size:13px;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>SSH PHOTO</h1>
    <div class="sprockets"><span></span><span></span><span></span><span></span></div>
  </header>

  <div id="loadRow">
    <button id="btnUpload">📁 사진 불러오기</button>
    <button id="btnCamera">📷 촬영하기</button>
    <input type="file" id="fileInput" accept="image/*">
    <input type="file" id="cameraInput" accept="image/*" capture="user">
  </div>

  <div id="canvasWrap" class="empty">
    <canvas id="baseCanvas"></canvas>
    <canvas id="stickerCanvas"></canvas>
  </div>

  <nav id="tabs">
    <button data-tab="retouch" class="active">인물보정</button>
    <button data-tab="filter">필터</button>
    <button data-tab="deco">스티커·텍스트</button>
    <button data-tab="save">저장</button>
  </nav>

  <div id="panels">
    <div class="panel active" id="panel-retouch">
      <div class="slider-row"><label>피부 매끄럽게 <span id="v-smooth">0</span></label>
        <input type="range" id="s-smooth" min="0" max="100" value="0"></div>
      <div class="slider-row"><label>피부 톤 밝기 <span id="v-whiten">0</span></label>
        <input type="range" id="s-whiten" min="0" max="100" value="0"></div>
      <div class="slider-row"><label>얼굴 슬림 <span id="v-slim">0</span></label>
        <input type="range" id="s-slim" min="0" max="100" value="0"></div>
      <div class="slider-row"><label>눈 크기 <span id="v-eye">0</span></label>
        <input type="range" id="s-eye" min="0" max="100" value="0"></div>
      <div class="slider-row"><label>코 슬림 <span id="v-nose">0</span></label>
        <input type="range" id="s-nose" min="0" max="100" value="0"></div>
      <div class="slider-row"><label>치아 미백 <span id="v-teeth">0</span></label>
        <input type="range" id="s-teeth" min="0" max="100" value="0"></div>
      <div class="slider-row"><label>입술 색상</label>
        <div class="swatch-row" id="lipColorRow"></div>
      </div>
      <p id="faceStatus" style="font-size:12px;color:#8a8580;margin-top:4px;">사진을 불러오면 얼굴을 자동으로 인식합니다. 실패하면 손으로 표시할 수 있습니다.</p>
      <button class="tool-btn" id="btnManualFace" style="display:none;">✍️ 손으로 얼굴 위치 표시하기</button>
    </div>

    <div class="panel" id="panel-filter">
      <div class="filter-grid" id="filterGrid"></div>
    </div>

    <div class="panel" id="panel-deco">
      <p style="font-size:12.5px;color:#8a8580;margin:0 0 8px;">스티커는 손가락으로 옮기고, 아래 크기 슬라이더로 조절하세요.</p>
      <div class="sticker-row" id="emojiRow"></div>
      <button class="tool-btn" id="btnAddText">✏️ 텍스트 추가</button>
      <button class="tool-btn" id="btnAddFrame">🖼️ 필름 프레임</button>
      <button class="tool-btn warn" id="btnDeleteSel">선택 삭제</button>
      <div class="slider-row" style="margin-top:10px;"><label>선택한 스티커/텍스트 크기 <span id="v-objscale">100</span>%</label>
        <input type="range" id="s-objscale" min="30" max="300" value="100"></div>
    </div>

    <div class="panel" id="panel-save">
      <button id="saveBtn">이미지로 저장하기</button>
      <p id="saveHint">완성된 사진이 새 창(다운로드)으로 저장됩니다.</p>
    </div>
  </div>

  <footer>Made by 심상현</footer>
</div>

<div id="textModal">
  <div class="box">
    <p style="margin:0 0 8px;font-size:13px;color:#c9c4bc;">텍스트 입력</p>
    <textarea id="textInput" placeholder="문구를 입력하세요"></textarea>
    <div class="color" id="textColorRow"></div>
    <div class="row">
      <button id="textCancel">취소</button>
      <button id="textOk" style="background:#e8a33d;color:#1c1b1a;border-color:#e8a33d;">추가</button>
    </div>
  </div>
</div>

<div id="loadingOverlay"><p id="loadingMsg">얼굴을 인식하는 중...</p></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js" crossorigin="anonymous"></script>
<script>
(function(){
  "use strict";

  // ---------- 기본 유틸 ----------
  const $ = id => document.getElementById(id);
  function toast(msg){
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._h); toast._h = setTimeout(()=>t.classList.remove('show'), 1800);
  }
  function showLoading(msg){ $('loadingMsg').textContent = msg||'처리 중...'; $('loadingOverlay').classList.add('show'); }
  function hideLoading(){ $('loadingOverlay').classList.remove('show'); }

  // ---------- 상태 ----------
  const state = {
    img: null,
    origCanvas: document.createElement('canvas'),   // 원본 픽셀 보관
    W: 0, H: 0,
    landmarks: null,          // 정규화 좌표(0~1) 배열
    manualFace: null,         // 자동 인식 실패 시 손으로 표시한 좌표
    filterName: 'none',
    objects: [],              // 스티커/텍스트/프레임 오브젝트
    selected: null
  };

  const baseCanvas = $('baseCanvas');
  const baseCtx = baseCanvas.getContext('2d', {willReadFrequently:true});
  const stkCanvas = $('stickerCanvas');
  const stkCtx = stkCanvas.getContext('2d');

  function setCanvasSize(w,h){
    state.W = w; state.H = h;
    [baseCanvas, stkCanvas, state.origCanvas].forEach(c=>{ c.width=w; c.height=h; });
    const maxCssW = Math.min(520, document.getElementById('canvasWrap').clientWidth - 20);
    const scale = Math.min(maxCssW / w, (window.innerHeight*0.5) / h, 1);
    const cssW = w*scale, cssH = h*scale;
    [baseCanvas, stkCanvas].forEach(c=>{ c.style.width = cssW+'px'; c.style.height = cssH+'px'; });
  }

  // ---------- 이미지 불러오기 ----------
  function loadFile(file){
    if(!file) return;
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const MAX = 1400;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX){
          const r = Math.min(MAX/w, MAX/h);
          w = Math.round(w*r); h = Math.round(h*r);
        }
        setCanvasSize(w,h);
        state.origCanvas.getContext('2d').clearRect(0,0,w,h);
        state.origCanvas.getContext('2d').drawImage(img,0,0,w,h);
        state.img = img;
        state.objects = []; state.selected = null;
        state.landmarks = null; state.manualFace = null;
        manualMarking = false;
        $('btnManualFace').style.display = 'none';
        document.getElementById('canvasWrap').classList.remove('empty');
        resetSliders();
        redrawBase();
        redrawStickers();
        detectFace();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }
  $('btnUpload').onclick = ()=> $('fileInput').click();
  $('btnCamera').onclick = ()=> $('cameraInput').click();
  $('fileInput').onchange = e => loadFile(e.target.files[0]);
  $('cameraInput').onchange = e => loadFile(e.target.files[0]);

  function resetSliders(){
    ['smooth','whiten','slim','eye','nose','teeth'].forEach(k=>{
      $('s-'+k).value = 0; $('v-'+k).textContent = 0;
    });
    lipColor = null;
    document.querySelectorAll('#lipColorRow span').forEach((el,i)=>el.classList.toggle('sel', i===0));
  }

  // ---------- 얼굴 인식 (MediaPipe FaceMesh) ----------
  let faceMesh = null;
  let faceMeshBroken = false;
  let faceRetryCount = 0;
  function initFaceMesh(){
    if (faceMesh || faceMeshBroken || typeof FaceMesh === 'undefined') return;
    try{
      faceMesh = new FaceMesh({locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/${f}`});
      faceMesh.setOptions({maxNumFaces:1, refineLandmarks:true, minDetectionConfidence:0.3, minTrackingConfidence:0.3});
      faceMesh.onResults(res=>{
        if (res.multiFaceLandmarks && res.multiFaceLandmarks.length){
          hideLoading();
          state.landmarks = res.multiFaceLandmarks[0];
          faceRetryCount = 0;
          $('faceStatus').textContent = '얼굴을 인식했습니다. 슬라이더로 보정해 보세요.';
        } else if (faceRetryCount < 2){
          // 배포 직후 첫 인식 시도는 인식 모델 파일이 아직 완전히 준비되지 않았을 수 있어 잠시 후 재시도
          faceRetryCount++;
          showLoading('얼굴을 다시 인식하는 중...');
          setTimeout(()=>{
            faceMesh.send({image: state.origCanvas}).catch(()=>{
              hideLoading();
              $('faceStatus').textContent = '이 기기/브라우저에서는 자동 얼굴 인식이 지원되지 않습니다. 아래 버튼으로 손으로 표시해 주세요.';
              $('btnManualFace').style.display = 'inline-flex';
            });
          }, 900);
        } else {
          hideLoading();
          state.landmarks = null;
          faceRetryCount = 0;
          $('faceStatus').textContent = '이 기기/브라우저에서는 자동 얼굴 인식이 지원되지 않습니다. 아래 버튼으로 손으로 표시해 주세요.';
          $('btnManualFace').style.display = 'inline-flex';
        }
      });
    } catch(err){
      faceMeshBroken = true;
      faceMesh = null;
    }
  }
  function detectFace(){
    if (typeof FaceMesh === 'undefined' || faceMeshBroken){
      $('faceStatus').textContent = '이 기기/브라우저에서는 자동 얼굴 인식이 지원되지 않습니다. 아래 버튼으로 손으로 표시해 주세요.';
      $('btnManualFace').style.display = 'inline-flex';
      return;
    }
    initFaceMesh();
    if (faceMeshBroken){
      $('faceStatus').textContent = '이 기기/브라우저에서는 자동 얼굴 인식이 지원되지 않습니다. 아래 버튼으로 손으로 표시해 주세요.';
      $('btnManualFace').style.display = 'inline-flex';
      return;
    }
    faceRetryCount = 0;
    showLoading('얼굴을 인식하는 중...');
    faceMesh.send({image: state.origCanvas}).catch(()=>{
      hideLoading();
      $('faceStatus').textContent = '얼굴 인식에 실패했습니다. 아래 버튼으로 손으로 표시해 보세요.';
      $('btnManualFace').style.display = 'inline-flex';
    });
  }
  function lm(i){
    const p = state.landmarks[i];
    return {x: p.x*state.W, y: p.y*state.H};
  }
  function mid(a,b){ return {x:(a.x+b.x)/2, y:(a.y+b.y)/2}; }

  // ---------- 얼굴 위치 손으로 표시하기 (자동 인식 실패 시 대안) ----------
  let manualMarking = false;
  let manualStep = 0;
  let manualPoints = {};
  const MANUAL_LABELS = ['왼쪽 눈', '오른쪽 눈', '입', '왼쪽 턱선(볼)', '오른쪽 턱선(볼)', '턱 끝'];
  const MANUAL_KEYS = ['leftEye','rightEye','mouth','jawLeft','jawRight','chin'];
  function startManualFace(){
    if (!state.img){ toast('먼저 사진을 불러와 주세요'); return; }
    manualMarking = true; manualStep = 0; manualPoints = {};
    $('faceStatus').textContent = `표시 1/6 · ${MANUAL_LABELS[0]} 위치를 사진에서 눌러주세요`;
  }
  function drawManualDots(){
    Object.values(manualPoints).forEach(pt=>{
      stkCtx.save();
      stkCtx.beginPath(); stkCtx.arc(pt.x, pt.y, 7, 0, Math.PI*2);
      stkCtx.fillStyle = '#e8a33d'; stkCtx.strokeStyle='#1c1b1a'; stkCtx.lineWidth=2;
      stkCtx.fill(); stkCtx.stroke();
      stkCtx.restore();
    });
  }
  function handleManualTap(p){
    const key = MANUAL_KEYS[manualStep];
    manualPoints[key] = p;
    manualStep++;
    drawManualDots();
    if (manualStep < MANUAL_LABELS.length){
      $('faceStatus').textContent = `표시 ${manualStep+1}/6 · ${MANUAL_LABELS[manualStep]} 위치를 사진에서 눌러주세요`;
    } else {
      state.manualFace = manualPoints;
      manualMarking = false;
      $('faceStatus').textContent = '손으로 표시했습니다. 슬라이더로 보정해 보세요.';
      redrawBase();
      drawManualDots();
    }
  }
  $('btnManualFace').onclick = startManualFace;

  // ---------- 픽셀 워프 (핀치/불지) ----------
  function localWarp(ctx, cx, cy, radius, strength){
    cx = Math.round(cx); cy = Math.round(cy); radius = Math.round(radius);
    const x0 = Math.max(0, cx-radius), y0 = Math.max(0, cy-radius);
    const x1 = Math.min(state.W, cx+radius), y1 = Math.min(state.H, cy+radius);
    const w = x1-x0, h = y1-y0;
    if (w<=0 || h<=0) return;
    const imgData = ctx.getImageData(x0,y0,w,h);
    const src = new Uint8ClampedArray(imgData.data);
    const data = imgData.data;
    const lcx = cx-x0, lcy = cy-y0;
    for(let y=0;y<h;y++){
      for(let x=0;x<w;x++){
        const dx = x-lcx, dy = y-lcy;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if(dist < radius && dist>0.001){
          const percent = 1 - dist/radius;
          const factor = Math.pow(percent,2) * strength;
          let srcX = lcx + dx*(1-factor);
          let srcY = lcy + dy*(1-factor);
          srcX = Math.min(w-1, Math.max(0, Math.round(srcX)));
          srcY = Math.min(h-1, Math.max(0, Math.round(srcY)));
          const di = (y*w+x)*4, si = (srcY*w+srcX)*4;
          data[di]=src[si]; data[di+1]=src[si+1]; data[di+2]=src[si+2]; data[di+3]=src[si+3];
        }
      }
    }
    ctx.putImageData(imgData, x0, y0);
  }

  // ---------- 인물 보정 렌더링 ----------
  function renderRetouch(ctx){
    if (!state.landmarks && !state.manualFace) return;
    let leftEye, rightEye, mouth, faceCenter, faceW, jawLeft, jawRight, chin;
    if (state.landmarks){
      leftEye = mid(lm(33), lm(133));
      rightEye = mid(lm(362), lm(263));
      mouth = mid(lm(61), lm(291));
      jawLeft = lm(234); jawRight = lm(454); chin = lm(152);
      faceCenter = mid(jawLeft, jawRight);
      faceW = Math.hypot(jawRight.x-jawLeft.x, jawRight.y-jawLeft.y);
    } else {
      const m = state.manualFace;
      leftEye = m.leftEye; rightEye = m.rightEye; mouth = m.mouth;
      jawLeft = m.jawLeft; jawRight = m.jawRight; chin = m.chin;
      faceCenter = mid(jawLeft, jawRight);
      faceW = Math.hypot(jawRight.x-jawLeft.x, jawRight.y-jawLeft.y);
    }
    const smooth = +$('s-smooth').value/100;
    const whiten = +$('s-whiten').value/100;
    const slim = +$('s-slim').value/100;
    const eye = +$('s-eye').value/100;
    const nose = +$('s-nose').value/100;
    const teeth = +$('s-teeth').value/100;
    const eyeMid = mid(leftEye, rightEye);
    const noseCenter = {x: eyeMid.x*0.55+mouth.x*0.45, y: eyeMid.y*0.55+mouth.y*0.45};

    const faceR = faceW*0.62;
    const eyeR = faceW*0.16;
    const mouthR = faceW*0.16;

    if (smooth > 0.01){
      ctx.save();
      ctx.beginPath();
      ctx.arc(faceCenter.x, faceCenter.y, faceR, 0, Math.PI*2);
      ctx.arc(leftEye.x, leftEye.y, eyeR, 0, Math.PI*2, true);
      ctx.arc(rightEye.x, rightEye.y, eyeR, 0, Math.PI*2, true);
      ctx.arc(mouth.x, mouth.y, mouthR, 0, Math.PI*2, true);
      ctx.clip('evenodd');
      ctx.filter = `blur(${(2+smooth*5).toFixed(1)}px)`;
      ctx.globalAlpha = 0.45 + smooth*0.35;
      ctx.drawImage(baseCanvas, 0, 0);
      ctx.restore();
    }
    if (whiten > 0.01){
      ctx.save();
      ctx.beginPath();
      ctx.arc(faceCenter.x, faceCenter.y, faceR, 0, Math.PI*2);
      ctx.clip();
      ctx.globalCompositeOperation = 'soft-light';
      ctx.fillStyle = `rgba(255,248,238,${(whiten*0.55).toFixed(2)})`;
      ctx.fillRect(faceCenter.x-faceR, faceCenter.y-faceR, faceR*2, faceR*2);
      ctx.restore();
    }
    if (slim > 0.01){
      localWarp(ctx, jawLeft.x, jawLeft.y, faceW*0.38, -slim*0.55);
      localWarp(ctx, jawRight.x, jawRight.y, faceW*0.38, -slim*0.55);
      localWarp(ctx, chin.x, chin.y, faceW*0.3, -slim*0.4);
    }
    if (eye > 0.01){
      localWarp(ctx, leftEye.x, leftEye.y, eyeR*1.6, eye*0.5);
      localWarp(ctx, rightEye.x, rightEye.y, eyeR*1.6, eye*0.5);
    }
    if (nose > 0.01){
      const noseW = faceW*0.11;
      localWarp(ctx, noseCenter.x-noseW, noseCenter.y, faceW*0.14, -nose*0.6);
      localWarp(ctx, noseCenter.x+noseW, noseCenter.y, faceW*0.14, -nose*0.6);
    }
    if (lipColor){
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(mouth.x, mouth.y, faceW*0.14, faceW*0.065, 0, 0, Math.PI*2);
      ctx.clip();
      ctx.globalCompositeOperation = 'multiply';
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = lipColor;
      ctx.fillRect(mouth.x-faceW*0.16, mouth.y-faceW*0.09, faceW*0.32, faceW*0.18);
      ctx.restore();
    }
    if (teeth > 0.01){
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(mouth.x, mouth.y, faceW*0.10, faceW*0.05, 0, 0, Math.PI*2);
      ctx.clip();
      ctx.globalCompositeOperation = 'screen';
      ctx.fillStyle = `rgba(255,255,255,${(teeth*0.5).toFixed(2)})`;
      ctx.fillRect(mouth.x-faceW*0.12, mouth.y-faceW*0.07, faceW*0.24, faceW*0.14);
      ctx.restore();
    }
  }

  function redrawBase(){
    if (!state.img) return;
    baseCtx.clearRect(0,0,state.W,state.H);
    baseCtx.filter = 'none';
    baseCtx.drawImage(state.origCanvas, 0, 0);
    renderRetouch(baseCtx);
    if (state.filterName === 'toon'){
      cartoonify(baseCtx);
    } else if (state.filterName !== 'none'){
      baseCtx.filter = FILTERS[state.filterName] || 'none';
      const tmp = document.createElement('canvas'); tmp.width=state.W; tmp.height=state.H;
      tmp.getContext('2d').drawImage(baseCanvas,0,0);
      baseCtx.clearRect(0,0,state.W,state.H);
      baseCtx.drawImage(tmp,0,0);
    }
    baseCtx.filter = 'none';
  }

  // ---------- 만화(카툰) 변환 ----------
  // Sobel 엣지 검출 + 색상 포스터라이즈로 만화풍 라인아트 효과를 만든다.
  function cartoonify(ctx){
    const w = state.W, h = state.H;
    if (w<2||h<2) return;
    const imgData = ctx.getImageData(0,0,w,h);
    const data = imgData.data;
    const gray = new Uint8ClampedArray(w*h);
    for (let i=0, p=0; i<data.length; i+=4, p++){
      gray[p] = data[i]*0.299 + data[i+1]*0.587 + data[i+2]*0.114;
    }
    const edge = new Uint8ClampedArray(w*h);
    for (let y=1; y<h-1; y++){
      const row=y*w, rowUp=(y-1)*w, rowDn=(y+1)*w;
      for (let x=1; x<w-1; x++){
        const gx = -gray[rowUp+x-1] + gray[rowUp+x+1]
                  -2*gray[row+x-1]  + 2*gray[row+x+1]
                  - gray[rowDn+x-1] + gray[rowDn+x+1];
        const gy = -gray[rowUp+x-1] - 2*gray[rowUp+x] - gray[rowUp+x+1]
                  + gray[rowDn+x-1] + 2*gray[rowDn+x] + gray[rowDn+x+1];
        edge[row+x] = Math.sqrt(gx*gx+gy*gy);
      }
    }
    const levels = 6;
    const step = 255/(levels-1);
    for (let i=0; i<data.length; i+=4){
      data[i]   = Math.round(Math.round(data[i]/step)*step);
      data[i+1] = Math.round(Math.round(data[i+1]/step)*step);
      data[i+2] = Math.round(Math.round(data[i+2]/step)*step);
    }
    const threshold = 70;
    for (let p=0, i=0; p<edge.length; p++, i+=4){
      if (edge[p] > threshold){ data[i]=25; data[i+1]=25; data[i+2]=25; }
    }
    ctx.putImageData(imgData,0,0);
  }

  ['s-smooth','s-whiten','s-slim','s-eye','s-nose','s-teeth'].forEach(id=>{
    $(id).addEventListener('input', ()=>{
      const key = id.replace('s-','v-');
      $(key).textContent = $(id).value;
      requestAnimationFrame(redrawBase);
    });
  });

  // ---------- 필터 ----------
  const FILTERS = {
    none: 'none',
    natural: 'brightness(1.05) contrast(0.97) saturate(1.05)',
    soft: 'brightness(1.06) contrast(0.94) saturate(1.06) blur(0.3px)',
    glow: 'brightness(1.12) contrast(1.03) saturate(1.15)',
    clear: 'brightness(1.02) contrast(1.15) saturate(1.2)',
    toon: 'none'
  };
  const FILTER_LABELS = {
    none:'원본', natural:'내추럴', soft:'소프트 뷰티', glow:'화사 글로우',
    clear:'선명하게', toon:'만화툰'
  };
  function buildFilterGrid(){
    const grid = $('filterGrid'); grid.innerHTML='';
    Object.keys(FILTERS).forEach(key=>{
      const div = document.createElement('div');
      div.className = 'filter-swatch' + (key===state.filterName?' active':'');
      div.innerHTML = `<img id="prev-${key}"><span>${FILTER_LABELS[key]}</span>`;
      div.onclick = ()=>{
        state.filterName = key;
        document.querySelectorAll('.filter-swatch').forEach(el=>el.classList.remove('active'));
        div.classList.add('active');
        redrawBase();
      };
      grid.appendChild(div);
    });
  }
  function updateFilterPreviews(){
    if (!state.img) return;
    Object.keys(FILTERS).forEach(key=>{
      const img = $('prev-'+key);
      if (!img) return;
      const c = document.createElement('canvas'); c.width=120; c.height=64;
      const cx = c.getContext('2d', {willReadFrequently:true});
      if (key === 'toon'){
        cx.drawImage(state.origCanvas, 0,0,120,64);
        const savedW=state.W, savedH=state.H;
        state.W=120; state.H=64;
        cartoonify(cx);
        state.W=savedW; state.H=savedH;
      } else {
        cx.filter = FILTERS[key];
        cx.drawImage(state.origCanvas, 0,0,120,64);
      }
      img.src = c.toDataURL();
    });
  }

  // ---------- 스티커 / 텍스트 / 프레임 ----------
  const EMOJIS = ['😊','😍','🥰','😎','✨','💕','🌸','🎀','⭐','🔥','🌈','☁️'];
  function buildEmojiRow(){
    const row = $('emojiRow'); row.innerHTML='';
    EMOJIS.forEach(e=>{
      const b = document.createElement('button'); b.textContent = e;
      b.onclick = ()=>{
        state.objects.push({type:'emoji', content:e, x:state.W/2, y:state.H/2, scale:1, baseSize:Math.min(state.W,state.H)*0.16});
        state.selected = state.objects[state.objects.length-1];
        $('s-objscale').value = 100; $('v-objscale').textContent = 100;
        redrawStickers();
      };
      row.appendChild(b);
    });
  }
  const TEXT_COLORS = ['#ffffff','#f2c14e','#ff6b6b','#4ecdc4','#1c1b1a'];
  function buildTextColorRow(){
    const row = $('textColorRow'); row.innerHTML='';
    TEXT_COLORS.forEach((c,i)=>{
      const s = document.createElement('span');
      s.style.background = c; if(i===0) s.classList.add('sel');
      s.onclick = ()=>{ row.querySelectorAll('span').forEach(x=>x.classList.remove('sel')); s.classList.add('sel'); s.dataset.chosen='1'; };
      row.appendChild(s);
    });
    row.children[0].dataset.chosen='1';
  }

  // ---------- 입술 색상 (메이투 스타일 가상 메이크업) ----------
  let lipColor = null;
  const LIP_COLORS = [null, '#c73b3b', '#e0654f', '#e0729a', '#b06a7a', '#c98b73'];
  function buildLipColorRow(){
    const row = $('lipColorRow'); row.innerHTML='';
    LIP_COLORS.forEach((c,i)=>{
      const s = document.createElement('span');
      if (c) s.style.background = c; else s.classList.add('none');
      if (i===0) s.classList.add('sel');
      s.onclick = ()=>{
        row.querySelectorAll('span').forEach(x=>x.classList.remove('sel'));
        s.classList.add('sel');
        lipColor = c;
        redrawBase();
      };
      row.appendChild(s);
    });
  }
  $('btnAddText').onclick = ()=>{
    if(!state.img){ toast('먼저 사진을 불러와 주세요'); return; }
    $('textInput').value=''; $('textModal').classList.add('show');
  };
  $('textCancel').onclick = ()=> $('textModal').classList.remove('show');
  $('textOk').onclick = ()=>{
    const txt = $('textInput').value.trim();
    if(!txt){ $('textModal').classList.remove('show'); return; }
    const chosen = $('textColorRow').querySelector('span.sel');
    const color = chosen ? getComputedStyle(chosen).backgroundColor : '#fff';
    state.objects.push({type:'text', content:txt, x:state.W/2, y:state.H/2, scale:1,
      baseSize:Math.min(state.W,state.H)*0.07, color});
    state.selected = state.objects[state.objects.length-1];
    $('s-objscale').value=100; $('v-objscale').textContent=100;
    $('textModal').classList.remove('show');
    redrawStickers();
  };
  $('btnAddFrame').onclick = ()=>{
    if(!state.img){ toast('먼저 사진을 불러와 주세요'); return; }
    if (state.objects.some(o=>o.type==='frame')){ toast('프레임은 이미 추가되어 있습니다'); return; }
    state.objects.unshift({type:'frame'});
    redrawStickers();
  };
  $('btnDeleteSel').onclick = ()=>{
    if(!state.selected){ toast('삭제할 스티커/텍스트를 먼저 선택하세요'); return; }
    state.objects = state.objects.filter(o=>o!==state.selected);
    state.selected = null;
    redrawStickers();
  };
  $('s-objscale').addEventListener('input', ()=>{
    $('v-objscale').textContent = $('s-objscale').value;
    if (state.selected){ state.selected.scale = +$('s-objscale').value/100; redrawStickers(); }
  });

  function redrawStickers(){
    stkCtx.clearRect(0,0,state.W,state.H);

    state.objects.forEach(o=>{
      if (o.type === 'frame'){
        stkCtx.save();
        stkCtx.strokeStyle = 'rgba(255,255,255,0.92)';
        stkCtx.lineWidth = Math.max(state.W,state.H)*0.035;
        stkCtx.strokeRect(0,0,state.W,state.H);
        stkCtx.restore();
        return;
      }
      stkCtx.save();
      stkCtx.translate(o.x, o.y);
      const size = o.baseSize * o.scale;
      if (o.type === 'emoji'){
        stkCtx.font = `${size}px sans-serif`;
        stkCtx.textAlign='center'; stkCtx.textBaseline='middle';
        if (o===state.selected) dashBox(stkCtx, size*0.7, size*0.7);
        stkCtx.fillText(o.content, 0, 0);
      } else if (o.type === 'text'){
        stkCtx.font = `700 ${size}px 'Pretendard', sans-serif`;
        stkCtx.textAlign='center'; stkCtx.textBaseline='middle';
        stkCtx.fillStyle = o.color;
        stkCtx.shadowColor='rgba(0,0,0,.45)'; stkCtx.shadowBlur=6;
        const w = stkCtx.measureText(o.content).width;
        if (o===state.selected) dashBox(stkCtx, w+16, size*1.3);
        stkCtx.fillText(o.content, 0, 0);
      }
      stkCtx.restore();
    });
  }
  function dashBox(ctx,w,h){
    ctx.save(); ctx.setLineDash([4,4]); ctx.strokeStyle='#e8a33d'; ctx.lineWidth=1.5;
    ctx.strokeRect(-w/2,-h/2,w,h); ctx.restore();
  }

  // ---------- 드래그(터치/마우스) ----------
  function canvasPoint(e){
    const rect = stkCanvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    const px = (t.clientX - rect.left) / rect.width * state.W;
    const py = (t.clientY - rect.top) / rect.height * state.H;
    return {x:px, y:py};
  }
  function hitTest(p){
    for (let i=state.objects.length-1;i>=0;i--){
      const o = state.objects[i];
      if (o.type==='frame') continue;
      const size = o.baseSize*o.scale;
      const half = (o.type==='emoji'? size*0.6 : size*0.9);
      if (Math.abs(p.x-o.x)<half && Math.abs(p.y-o.y)<half) return o;
    }
    return null;
  }
  let dragging = null, dragOffset={x:0,y:0};
  function ptrDown(e){
    const p = canvasPoint(e);
    if (manualMarking){ handleManualTap(p); e.preventDefault(); return; }
    const hit = hitTest(p);
    state.selected = hit;
    if (hit){
      dragging = hit; dragOffset = {x:p.x-hit.x, y:p.y-hit.y};
      stkCanvas.classList.add('dragging');
      $('s-objscale').value = Math.round(hit.scale*100);
      $('v-objscale').textContent = $('s-objscale').value;
    }
    redrawStickers();
    e.preventDefault();
  }
  function ptrMove(e){
    if (!dragging) return;
    const p = canvasPoint(e);
    dragging.x = p.x - dragOffset.x; dragging.y = p.y - dragOffset.y;
    redrawStickers();
    e.preventDefault();
  }
  function ptrUp(){ dragging=null; stkCanvas.classList.remove('dragging'); }
  stkCanvas.addEventListener('mousedown', ptrDown);
  stkCanvas.addEventListener('mousemove', ptrMove);
  window.addEventListener('mouseup', ptrUp);
  stkCanvas.addEventListener('touchstart', ptrDown, {passive:false});
  stkCanvas.addEventListener('touchmove', ptrMove, {passive:false});
  stkCanvas.addEventListener('touchend', ptrUp);

  // ---------- 탭 전환 ----------
  document.querySelectorAll('#tabs button').forEach(btn=>{
    btn.onclick = ()=>{
      document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      $('panel-'+btn.dataset.tab).classList.add('active');
      if (btn.dataset.tab === 'filter') updateFilterPreviews();
    };
  });

  // ---------- 저장 ----------
  $('saveBtn').onclick = ()=>{
    if (!state.img){ toast('먼저 사진을 불러와 주세요'); return; }
    const out = document.createElement('canvas');
    out.width = state.W; out.height = state.H;
    const octx = out.getContext('2d');
    octx.drawImage(baseCanvas,0,0);
    octx.drawImage(stkCanvas,0,0);
    out.toBlob(blob=>{
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `photo-studio-${Date.now()}.png`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      toast('저장되었습니다');
    }, 'image/png');
  };

  buildFilterGrid();
  buildEmojiRow();
  buildTextColorRow();
  buildLipColorRow();

  // ---------- 서비스워커 등록 & 자동 업데이트 ----------
  if ('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('service-worker.js').then(reg=>{
        reg.addEventListener('updatefound', ()=>{
          const nw = reg.installing;
          nw.addEventListener('statechange', ()=>{
            if (nw.state === 'installed' && navigator.serviceWorker.controller){
              toast('새 버전을 불러오는 중...');
            }
          });
        });
      }).catch(()=>{});
      let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', ()=>{
        if (reloaded) return;
        reloaded = true;
        location.reload();
      });
    });
  }
})();
</script>
</body>
</html>
